# SpaceMissionStudio: builds the release files of a tag on Linux and
# Windows, installs each one on its own platform and runs it, then
# attaches them to the tag's GitHub release with their checksums
# (SpaceMissionStudio/docs/developer/releasing.md, sections 5 and 6).
#
# Pushing a tag spacemissionstudio-vX.Y.Z starts it; "Run workflow" with
# the tag runs it again for an existing tag. The build jobs only read the
# repository and hand their files on as artifacts; the last job, the only
# one with write access, attaches them. A release that does not exist yet
# is created as a draft, so publishing stays a person's step. On an
# existing release the files are replaced and its notes are written only
# when they are empty. A pull request that changes this workflow runs the
# build and install jobs for the version in its files, and attaches nothing.
#
#   Linux (x86_64):  the wheel, the sdist and the .deb (SHA256SUMS-linux);
#                    the .deb is installed with the network cut off and
#                    the tool run offline.
#   Windows (x64):   the Inno Setup program (SHA256SUMS-windows, unsigned);
#                    installed silently and the tool run.
#   Both installers are self-contained: a private Python with Basilisk,
#   that wheel, every package and the support data
#   (SpaceMissionStudio/packaging/bundle_python.py). macOS is not
#   supported (removed on 2026-10-21 by the user's decision).
name: "SpaceMissionStudio release"

on:
  push:
    tags: ["spacemissionstudio-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach, for example spacemissionstudio-v1.2.0"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/spacemissionstudio-release.yml"

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # What to build: the tag, or on a pull request its own commit.
  SOURCE: ${{ github.event_name == 'pull_request' && github.sha || inputs.tag || github.ref_name }}
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: SpaceMissionStudio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: The tag matches the version files and the CHANGELOG
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          else
            case "$TAG" in spacemissionstudio-v*) ;; *) echo "::error::$TAG is not a spacemissionstudio-vX.Y.Z tag"; exit 1 ;; esac
            version="${TAG#spacemissionstudio-v}"
          fi
          grep -qx "version = \"$version\"" pyproject.toml || { echo "::error::pyproject.toml is not $version"; exit 1; }
          grep -q "^__version__ = \"$version\"" spacemissionstudio/__init__.py || { echo "::error::__init__.py is not $version"; exit 1; }
          grep -q "#define MyAppVersion \"$version\"" packaging/windows/spacemissionstudio.iss || { echo "::error::the .iss is not $version"; exit 1; }
          grep -q "^## $version (" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - name: Build the wheel, the sdist and the .deb
        run: |
          python -m pip install --quiet build
          packaging/build_wheel.sh dist
          packaging/build_deb.sh dist
          ls -l dist
      - name: The wheel holds the bundled fonts and icons
        run: |
          python - "dist/spacemissionstudio-$VERSION-py3-none-any.whl" <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          fonts = [n for n in names if n.endswith(".ttf")]
          licences = [n for n in names if n.endswith("/OFL.txt")]
          icons = [n for n in names if "/lucide/" in n and n.endswith(".svg")]
          print(len(fonts), "fonts,", len(licences), "OFL texts,", len(icons), "icons")
          assert len(fonts) == 5 and len(licences) == 2 and len(icons) >= 35, "assets missing from the wheel"
          assert any(n.endswith("/lucide/LICENSE") for n in names), "Lucide's licence missing"
          EOF
      # The system libraries it depends on come from apt (a desktop has
      # them); the package itself is then installed with no network.
      - name: Install the .deb with the network cut off
        run: |
          deb="./dist/spacemissionstudio_${VERSION}_amd64.deb"
          dpkg-deb --info "$deb"
          mapfile -t depends < <(dpkg-deb --field "$deb" Depends | tr ',' '\n' | sed 's/([^)]*)//; s/|.*//' | xargs -n1)
          sudo apt-get install -y --no-install-recommends "${depends[@]}"
          sudo unshare --net dpkg -i "$deb"
      # Offline as well, and outside the checkout, so that Python imports the
      # installed package, not the source tree in the working directory.
      - name: Run the installed tool with no network
        working-directory: ${{ runner.temp }}
        run: |
          cat > installed_check.sh <<'SCRIPT'
          set -euo pipefail
          python=/opt/spacemissionstudio/python/bin/python3
          spacemissionstudio --version | tee version.txt
          grep -q "SpaceMissionStudio $VERSION" version.txt
          spacemissionstudio kernels-status
          templates=$("$python" -I -c "import pathlib, spacemissionstudio; print(pathlib.Path(spacemissionstudio.__file__).parent / 'scenarios' / 'templates')")
          for f in "$templates"/*.json; do spacemissionstudio validate "$f" >/dev/null || { echo "::error::$f does not validate"; exit 1; }; done
          spacemissionstudio run "$templates/01_two_body_circular_orbit.json" --out-dir "$RUNNER_TEMP/run01"
          grep -q "/opt/spacemissionstudio/python/lib/python3.14/site-packages/supportData/EphemerisData/de430.bsp" \
            "$RUNNER_TEMP"/run01/*provenance.json
          "$python" -I -c "from spacemissionstudio.engine import earth_orientation as e; assert e.installed(), 'no Earth orientation files'"
          "$python" -I - "$VERSION" <<'EOF'
          import os, sys
          from PySide6.QtWidgets import QApplication
          app = QApplication(sys.argv[:1])
          from spacemissionstudio.gui.theme import apply_theme
          apply_theme(app)  # as gui/app.py does: registers the bundled fonts
          import spacemissionstudio
          from spacemissionstudio.gui.main_window import MainWindow
          assert spacemissionstudio.__version__ == sys.argv[1], spacemissionstudio.__version__
          window = MainWindow()
          window.show()
          print("GUI started:", spacemissionstudio.__file__, "font", app.font().family(), flush=True)
          assert app.font().family() == "Inter", app.font().family()
          os._exit(0)  # skip Qt WebEngine's teardown at exit
          EOF
          SCRIPT
          # An empty support-data cache too: the kernels must come from the package.
          sudo unshare --net sudo -u "$USER" env HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" VERSION="$VERSION" \
            BSK_SUPPORT_DATA_CACHE="$RUNNER_TEMP/empty-support-data-cache" QT_QPA_PLATFORM=offscreen bash installed_check.sh
      - name: SHA256SUMS-linux
        run: |
          cd dist
          sha256sum "spacemissionstudio-$VERSION-py3-none-any.whl" "spacemissionstudio-$VERSION.tar.gz" \
            "spacemissionstudio_${VERSION}_amd64.deb" > SHA256SUMS-linux
          cat SHA256SUMS-linux
      - uses: actions/upload-artifact@v6
        with:
          name: packages-linux
          if-no-files-found: error
          path: |
            SpaceMissionStudio/dist/*.whl
            SpaceMissionStudio/dist/*.tar.gz
            SpaceMissionStudio/dist/*.deb
            SpaceMissionStudio/dist/SHA256SUMS-linux

  windows:
    needs: linux
    env:
      VERSION: ${{ needs.linux.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: SpaceMissionStudio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v6
        with:
          name: packages-linux
          path: linux
      - name: The wheel built for this release, checked against SHA256SUMS-linux
        run: |
          $wheel = Get-ChildItem ..\linux\spacemissionstudio-*.whl | Select-Object -First 1
          $line = Select-String -Path ..\linux\SHA256SUMS-linux -SimpleMatch $wheel.Name | Select-Object -First 1
          if (-not $line) { throw "SHA256SUMS-linux does not list $($wheel.Name)" }
          $expected = $line.Line.Split(" ")[0]
          $actual = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "$($wheel.Name): SHA-256 $actual, SHA256SUMS-linux says $expected" }
          New-Item -ItemType Directory -Force packaging\windows\dist | Out-Null
          Copy-Item $wheel.FullName packaging\windows\dist\
          Write-Host "Bundling $($wheel.Name) ($actual)"
      - name: The bundled Python (Basilisk, the wheel, the packages, the support data)
        run: |
          $wheel = Get-ChildItem packaging\windows\dist\spacemissionstudio-*.whl | Select-Object -First 1
          # A short folder: the checkout path plus Qt's deepest files would pass
          # Windows' 260-character limit.
          $dest = Join-Path $env:RUNNER_TEMP "py"
          python packaging\bundle_python.py --platform windows --dest $dest --wheel $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "bundle_python.py failed" }
          "PYTHON_DIR=$dest" >> $env:GITHUB_ENV
      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build the setup program
        run: |
          & $env:ISCC "/DPythonDir=$env:PYTHON_DIR" packaging\windows\spacemissionstudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $exe = Get-ChildItem packaging\windows\Output\spacemissionstudio-*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so sha256sum -c reads it on Linux.
          [IO.File]::WriteAllText((Join-Path $PWD "packaging\windows\Output\SHA256SUMS-windows"), "$hash  $($exe.Name)`n")
          Get-Content packaging\windows\Output\SHA256SUMS-windows
      - name: Install it silently, as a user would
        run: |
          $exe = Get-ChildItem packaging\windows\Output\spacemissionstudio-*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "SpaceMissionStudio"
          $log = Join-Path $PWD "packaging\windows\Output\install.log"
          $p = Start-Process $exe.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $python = Join-Path $dir "python\python.exe"
          if (-not (Test-Path $python)) { throw "no Python at $($python); see install.log" }
          "INSTALLED_PYTHON=$python" >> $env:GITHUB_ENV
      # An empty support-data cache: the kernels must come from the setup.
      - name: Run the installed tool
        working-directory: ${{ runner.temp }}
        run: |
          $version = $env:VERSION
          $env:BSK_SUPPORT_DATA_CACHE = Join-Path $env:RUNNER_TEMP "empty-support-data-cache"
          $out = & $env:INSTALLED_PYTHON -I -c "import spacemissionstudio, Basilisk; print('SpaceMissionStudio', spacemissionstudio.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "import failed" }
          $out = $out | Select-Object -Last 1
          if ($out -ne "SpaceMissionStudio $version") { throw "installed: $out, expected $version" }
          & $env:INSTALLED_PYTHON -I -m spacemissionstudio.cli kernels-status
          if ($LASTEXITCODE -ne 0) { throw "kernels-status failed" }
          $templates = & $env:INSTALLED_PYTHON -I -c "import pathlib, spacemissionstudio; print(pathlib.Path(spacemissionstudio.__file__).parent / 'scenarios' / 'templates')"
          $template = Join-Path $templates "01_two_body_circular_orbit.json"
          & $env:INSTALLED_PYTHON -I -m spacemissionstudio.cli validate $template
          if ($LASTEXITCODE -ne 0) { throw "validate failed" }
          $run = Join-Path $env:RUNNER_TEMP "run01"
          & $env:INSTALLED_PYTHON -I -m spacemissionstudio.cli run $template --out-dir $run
          if ($LASTEXITCODE -ne 0) { throw "run failed" }
          if (-not (Select-String -Path (Join-Path $run "*provenance.json") -SimpleMatch 'site-packages\\supportData' -Quiet)) { throw "the run did not use the bundled support data" }
          & $env:INSTALLED_PYTHON -I -c "from spacemissionstudio.engine import earth_orientation as e; assert e.installed(), 'no Earth orientation files'"
          if ($LASTEXITCODE -ne 0) { throw "the setup's Earth orientation files are not found" }
          @'
          import os, sys
          from PySide6.QtWidgets import QApplication
          app = QApplication(sys.argv[:1])
          from spacemissionstudio.gui.theme import apply_theme
          apply_theme(app)  # as gui/app.py does: registers the bundled fonts
          import spacemissionstudio
          from spacemissionstudio.gui.main_window import MainWindow
          assert spacemissionstudio.__version__ == sys.argv[1], spacemissionstudio.__version__
          window = MainWindow()
          window.show()
          print("GUI started:", spacemissionstudio.__file__, "font", app.font().family(), flush=True)
          assert app.font().family() == "Inter", app.font().family()
          os._exit(0)  # skip Qt WebEngine's teardown at exit
          '@ | Set-Content -Path smoke_gui.py -Encoding utf8
          & $env:INSTALLED_PYTHON -I smoke_gui.py $version
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed" }
      - uses: actions/upload-artifact@v6
        with:
          name: packages-windows
          if-no-files-found: error
          path: |
            SpaceMissionStudio/packaging/windows/Output/*.exe
            SpaceMissionStudio/packaging/windows/Output/SHA256SUMS-windows
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-install-log
          path: SpaceMissionStudio/packaging/windows/Output/install.log

  # The whole test suite, lint, the document checks and pip-audit, on the
  # tag's own commit, on Linux and Windows (the SpaceMissionStudio
  # workflow); nothing is attached unless they pass (audit R11).
  tests:
    uses: ./.github/workflows/spacemissionstudio.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.sha || inputs.tag || github.ref_name }}

  attach:
    needs: [linux, windows, tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One attach per tag at a time. Only this job is queued per tag: when
    # the whole run was, a job waiting for a runner held back a second run
    # for the same tag (2026-10-21, run 39575072165 waited on the macOS job,
    # since removed, of run 39573007055).
    concurrency:
      group: spacemissionstudio-release-attach-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.linux.outputs.version }}
    defaults:
      run:
        working-directory: SpaceMissionStudio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/download-artifact@v6
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Check every file against its checksum
        run: |
          cd ../release
          ls -l
          sha256sum -c SHA256SUMS-linux
          sha256sum -c SHA256SUMS-windows
          shopt -s nullglob
          packages=(./*.whl ./*.tar.gz ./*.deb ./*-setup.exe)
          test "${#packages[@]}" = 4
      - name: Release notes from the CHANGELOG and the built files
        # Summary, who should update, downloads with sizes, install, the
        # installers' SHA-256, what is new, contents, checks and known
        # limits (packaging/release_notes.py; docs/developer/releasing.md).
        run: |
          python3 packaging/release_notes.py --version "$VERSION" --files ../release \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Attach to the release (a missing release is created as a draft)
        run: |
          version="$VERSION"
          files=(../release/*.whl ../release/*.tar.gz ../release/*.deb ../release/*-setup.exe ../release/SHA256SUMS-linux ../release/SHA256SUMS-windows)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "SpaceMissionStudio $version" \
              --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
          fi
          gh release view "$TAG" --json isDraft,assets --jq '"draft: \(.isDraft)", (.assets[] | "\(.name)  \(.size) bytes")'
