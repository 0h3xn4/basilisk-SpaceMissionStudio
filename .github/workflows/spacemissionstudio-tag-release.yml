# SpaceMissionStudio: tag a release, then build it.
# Run it from Actions > "SpaceMissionStudio tag release" > Run workflow,
# with the version (SpaceMissionStudio/docs/developer/releasing.md,
# section 6). The assistant can start it too, when asked to tag a release.
#
#   1. check:   "SpaceMissionStudio release check" on the branch (CI passed
#               on its head commit, pip-audit with today's advisories, the
#               version files, the CHANGELOG dated today, nothing left under
#               Unreleased, the tag new, the notes render). Any failure
#               stops here, with nothing tagged.
#   2. tag:     the version asked for must be the version the files state;
#               the annotated tag spacemissionstudio-vX.Y.Z goes on exactly
#               the commit the check passed (not a newer head), pushed with
#               this workflow's token.
#   3. release: a tag pushed with the workflow's token starts no workflow
#               (GitHub's rule), so this starts "SpaceMissionStudio release"
#               for the tag, which builds, tests and attaches the files to
#               a draft release. Publishing the draft stays a person's step.
name: "SpaceMissionStudio tag release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to tag, for example 2.8.0 (must match the version files)"
        required: true
        type: string
      ref:
        description: "Branch whose head commit is tagged"
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: spacemissionstudio-tag-release
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/spacemissionstudio-release-check.yml
    with:
      ref: ${{ inputs.ref }}

  tag:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # push the tag
      actions: write  # start the release workflow
    env:
      VERSION: ${{ inputs.version }}
      CHECKED_VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - name: The version asked for is the one checked
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a version X.Y.Z"; exit 1 ;;
          esac
          if [ "$VERSION" != "$CHECKED_VERSION" ]; then
            echo "::error::Asked to tag $VERSION, but the files at $SHA state $CHECKED_VERSION."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: Tag the checked commit
        run: |
          tag="spacemissionstudio-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$SHA" -m "SpaceMissionStudio $VERSION"
          git push origin "refs/tags/$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run spacemissionstudio-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
          {
            echo "# Tagged $TAG"
            echo
            echo "- Commit: \`$SHA\`"
            echo "- The release build was started: Actions > SpaceMissionStudio release."
            echo "- When it has attached the files to the draft release, check them and publish the draft."
          } >> "$GITHUB_STEP_SUMMARY"
